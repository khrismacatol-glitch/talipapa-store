<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Talipapa grocery relevance labeling</title>
  <style>
    :root { font-family: sans-serif; color: #1a1a1a; }
    body { margin: 0; display: grid; grid-template-columns: 320px 1fr; min-height: 100vh; }
    aside { background: #f4f1ea; padding: 1rem; overflow: auto; border-right: 1px solid #d9d0c3; }
    main { padding: 1rem 1.25rem; overflow: auto; }
    h1 { font-size: 1.1rem; margin: 0 0 .5rem; }
    .q { display: block; width: 100%; text-align: left; margin: 0 0 4px; padding: .4rem .5rem; border: 1px solid #d9d0c3; background: #fff; cursor: pointer; }
    .q.active { background: #2f6f4e; color: #fff; border-color: #2f6f4e; }
    .q.test { border-left: 4px solid #b45309; }
    .hint { font-size: .85rem; color: #444; margin: .5rem 0 1rem; }
    input[type=search] { width: 100%; padding: .5rem; margin: .5rem 0 1rem; }
    table { border-collapse: collapse; width: 100%; font-size: .9rem; }
    th, td { border-bottom: 1px solid #eee; padding: .4rem .3rem; vertical-align: top; }
    button.g { margin-right: 4px; }
    button.g.on2 { background: #2f6f4e; color: #fff; }
    button.g.on1 { background: #b45309; color: #fff; }
    button.g.on0 { background: #6b7280; color: #fff; }
    .bar { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
  </style>
</head>
<body>
<aside>
  <h1>Queries</h1>
  <p class="hint">Orange border = frozen <strong>test</strong>. Grades are empty until you click 2, 1, or 0. Nothing is pre-labeled.</p>
  <div id="queries"></div>
</aside>
<main>
  <div class="bar">
    <button id="save">Download qrels.csv</button>
    <button id="load">Load qrels.csv</button>
    <input id="file" type="file" accept=".csv" hidden>
    <span id="status"></span>
  </div>
  <h1 id="current"></h1>
  <p class="hint" id="meta"></p>
  <input type="search" id="filter" placeholder="Filter products by name, description, or aisle (your search, not a grade)">
  <table>
    <thead>
      <tr><th>Grade</th><th>Product</th><th>Aisle</th><th>Key</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<script>
const grades = {}; // query -> { product_key: grade }
let queries = [];
let products = [];
let active = 0;

function parseCsv(text) {
  const lines = text.replace(/^\uFEFF/, "").split(/\r?\n/).filter(l => l.length);
  if (!lines.length) return [];
  const headers = splitCsvLine(lines[0]);
  return lines.slice(1).map(line => {
    const cells = splitCsvLine(line);
    const row = {};
    headers.forEach((h, i) => row[h] = cells[i] ?? "");
    return row;
  });
}

function splitCsvLine(line) {
  const out = [];
  let cur = "", inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQ) {
      if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; }
      else if (ch === '"') inQ = false;
      else cur += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ",") { out.push(cur); cur = ""; }
    else cur += ch;
  }
  out.push(cur);
  return out;
}

function csvEscape(s) {
  s = String(s ?? "");
  return /[",\n]/.test(s) ? '"' + s.replaceAll('"', '""') + '"' : s;
}

async function boot() {
  const [qText, pJson] = await Promise.all([
    fetch("queries.csv").then(r => r.text()),
    fetch("products.json").then(r => r.json()),
  ]);
  queries = parseCsv(qText);
  products = pJson;
  document.getElementById("queries").innerHTML = queries.map((q, i) =>
    `<button class="q ${q.split === "test" ? "test" : ""}" data-i="${i}">${q.query} <small>(${q.family} · ${q.split} · ${q.lang})</small></button>`
  ).join("");
  document.getElementById("queries").addEventListener("click", e => {
    const b = e.target.closest(".q");
    if (!b) return;
    active = Number(b.dataset.i);
    render();
  });
  document.getElementById("filter").addEventListener("input", render);
  document.getElementById("save").addEventListener("click", download);
  document.getElementById("load").addEventListener("click", () => document.getElementById("file").click());
  document.getElementById("file").addEventListener("change", loadFile);
  render();
}

function render() {
  document.querySelectorAll(".q").forEach((b, i) => b.classList.toggle("active", i === active));
  const q = queries[active];
  if (!q) return;
  document.getElementById("current").textContent = q.query;
  document.getElementById("meta").textContent =
    `family=${q.family} split=${q.split} lang=${q.lang} contrast=${q.contrast_group || "—"} — ${q.notes || ""}`;
  const needle = document.getElementById("filter").value.trim().toLowerCase();
  const map = grades[q.query] || {};
  const body = products.filter(p => {
    if (!needle) return true;
    const blob = `${p.name} ${p.description || ""} ${p.category || ""} ${p.key}`.toLowerCase();
    return blob.includes(needle);
  }).map(p => {
    const g = map[p.key];
    return `<tr>
      <td>
        <button class="g ${g === "2" ? "on2" : ""}" data-key="${p.key}" data-g="2">2</button>
        <button class="g ${g === "1" ? "on1" : ""}" data-key="${p.key}" data-g="1">1</button>
        <button class="g ${g === "0" ? "on0" : ""}" data-key="${p.key}" data-g="0">0</button>
      </td>
      <td><strong>${escapeHtml(p.name)}</strong><br><small>${escapeHtml(p.description || "")}</small></td>
      <td>${escapeHtml(p.category || "")}</td>
      <td><code>${escapeHtml(p.key)}</code></td>
    </tr>`;
  }).join("");
  document.getElementById("rows").innerHTML = body;
  document.getElementById("rows").onclick = e => {
    const b = e.target.closest("button.g");
    if (!b) return;
    const key = b.dataset.key;
    grades[q.query] = grades[q.query] || {};
    if (grades[q.query][key] === b.dataset.g) delete grades[q.query][key];
    else grades[q.query][key] = b.dataset.g;
    status(`${Object.values(grades).reduce((n, m) => n + Object.keys(m).length, 0)} graded pairs in this browser session`);
    render();
  };
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function download() {
  const lines = ["query,product_key,grade,notes"];
  for (const q of queries) {
    const map = grades[q.query] || {};
    for (const [key, grade] of Object.entries(map)) {
      lines.push([q.query, key, grade, ""].map(csvEscape).join(","));
    }
  }
  const blob = new Blob([lines.join("\n") + "\n"], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "qrels.csv";
  a.click();
}

async function loadFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const rows = parseCsv(await file.text());
  for (const r of rows) {
    if (!r.query || !r.product_key || r.grade === "") continue;
    grades[r.query] = grades[r.query] || {};
    grades[r.query][r.product_key] = String(r.grade);
  }
  status("Loaded existing qrels into this session");
  render();
}

function status(t) { document.getElementById("status").textContent = t; }

boot().catch(err => { document.getElementById("status").textContent = err; });
</script>
</body>
</html>
